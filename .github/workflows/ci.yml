name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      calibrate_benchmarks:
        description: Run three benchmark passes on one runner (up to six hours)
        type: boolean
        default: false
      benchmark_base:
        description: Exact base commit for a paired benchmark comparison
        type: string
        default: ''

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # GitHub's hosted Linux runners have a tight disk budget. Full debug info in
  # the test/dev profiles exhausted it while compiling the workspace tests.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Raised from 15 (aegis-44vjem). Not failing — 12.8m of 15, 86% — which is
    # exactly when to move it. The point of that bead is to stop meeting these
    # one failure at a time; scripts/audit-workflow-timeout-headroom.sh is what
    # surfaced this one before it crossed.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
        with:
          shared-key: ci-native

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features

      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features

      - name: Check (all targets)
        run: cargo check --all-targets --all-features

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2.87.0
        with:
          tool: cargo-audit

      - name: Security audit
        run: cargo audit --deny warnings
        continue-on-error: true  # Advisory-only for now

      - name: Check for yanked dependencies
        run: cargo audit --deny yanked

  # THREE FEATURE SETS, THREE JOBS, IN PARALLEL — not three steps sharing one
  # budget.
  #
  # These are three separate compiles (all-features, no-default-features and the
  # default set the doc tests use), so running them as steps of one job cost the
  # SUM of three builds plus three test runs against a single timeout. Measured
  # on run 33945673274: all-features took 49m30s and no-default-features was
  # killed 40m later at the 90m job wall, with the doc tests never starting.
  #
  # It had been over budget for some time and was masked: on 23223607 the
  # no-default-features step FAILED at ~81m, and cargo stops there, so the run
  # exited before the wall and the suite never revealed that it no longer fits.
  # Repairing that assertion is what surfaced the timeout.
  #
  # Splitting costs the same total compute and about a third of the wall time,
  # and it also stops one feature set's failure from hiding the next one's.
  # Raising timeout-minutes instead would have bought silence: the number would
  # grow again, and the masking would remain.
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
        with:
          shared-key: ci-native

      # The recovery fixtures exercise full, disk-backed reconciliation, so this
      # one alone runs ~50m on a cold hosted runner.
      - name: Run all tests (all features)
        run: cargo test --all-features -- --nocapture
        env:
          RUST_LOG: beads_rust=debug

  test-no-default-features:
    name: Test Suite (no default features)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
        with:
          shared-key: ci-native

      - name: Run tests (no default features)
        run: cargo test --no-default-features

  test-doc:
    name: Doc Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
        with:
          shared-key: ci-native

      - name: Run doc tests
        run: cargo test --doc

  reliability-gates:
    name: Reliability Gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
        with:
          shared-key: ci-native

      - name: Failure-corpus replay and doctor/recovery postconditions
        run: cargo test --test workspace_failure_replay -- --nocapture
        env:
          RUST_LOG: beads_rust=debug

      - name: Crash-injection sync matrix
        run: cargo test --test e2e_sync_failure_injection -- --nocapture
        env:
          HARNESS_ARTIFACTS: 1
          NO_COLOR: 1

      - name: Long-lived single-workspace stress
        run: cargo test --test e2e_workspace_scenarios scenario_long_lived_single_workspace_stress_suite -- --nocapture
        env:
          BR_LONG_STRESS_ITERATIONS: 8
          HARNESS_ARTIFACTS: 1
          NO_COLOR: 1

      - name: Concurrent command-family integrity stress
        run: cargo test --test e2e_concurrency e2e_interleaved_command_families_preserve_workspace_integrity -- --nocapture
        env:
          HARNESS_ARTIFACTS: 1
          NO_COLOR: 1

      - name: Upload reliability artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reliability-gate-artifacts
          path: target/test-artifacts/
          if-no-files-found: ignore

  audit-gates:
    name: Audit Guardrails (2026-05-09)
    runs-on: ubuntu-latest
    # Snapshot freshness performs a release build plus the full fixture corpus.
    # A 60-minute cap canceled healthy runs before later witnesses could start.
    timeout-minutes: 90
    needs: check
    # Gates added by beads_rust-6jmq for the audit-driven cleanup EPIC
    # (beads_rust-ebzi). Each step corresponds to a sibling bead's harness:
    #   - Snapshot freshness    (l6xl)
    #   - ID-pinning lint       (s5se) — runs as part of `cargo test`
    #   - Forced-cycle-close audit (30ci)
    #   - Sync-safety witness   (yyxo) — Linux only
    #   - Concurrency witness   (mjmk)
    # Documented in docs/TESTING_GUIDELINES.md and the per-bead specs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
        with:
          shared-key: ci-native

      - name: Install cargo-insta
        # Tool installation must not inherit the repository's pinned nightly:
        # cargo-insta's locked rustix 0.37 dependency is incompatible with it.
        run: cargo +stable install cargo-insta --locked --version 1.46.1

      - name: Build release br binary (used by shell harnesses)
        run: cargo build --release

      # l6xl: snapshot freshness — fails CI on any *.snap.new alongside *.snap
      - name: Snapshot freshness gate (beads_rust-l6xl)
        run: cargo insta test --check --workspace
        env:
          RUST_LOG: error

      # 30ci: regression check that no closed bead has audit-suspect close_reason
      # without an audit-historical-cycle-close-* escape-hatch label
      - name: Audit suspect close_reasons gate (beads_rust-30ci)
        run: bash tests/e2e_scripts/forced_cycle_close_audit.sh

      # yyxo: filesystem-witness regression for sync allowlist (PC-1 / PC-RECOVERY)
      - name: Sync safety witness (beads_rust-yyxo)
        run: |
          export BR_BIN="$(pwd)/target/release/br"
          bash tests/e2e_scripts/sync_safety_witness.sh

      # mjmk: 50-iter concurrency no-flake harness — readers race writer.
      # Smoke-run 5 iters in CI to keep wall time bounded; full 50-iter
      # is a local pre-merge check.
      - name: Concurrency witness 5-iter smoke (beads_rust-mjmk)
        run: |
          export BR_BIN="$(pwd)/target/release/br"
          ITER_OVERRIDE=5 bash tests/e2e_scripts/concurrency_witness_logged.sh

      - name: Upload audit-gate event logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: audit-gate-event-logs
          path: |
            /tmp/sync_safety_witness_*.jsonl
            /tmp/concurrency_witness_*.jsonl
            /tmp/forced_cycle_close_audit_*.summary.txt
          if-no-files-found: ignore

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Raised from 30 (aegis-44vjem). `cancelled` at 30.2m on run 33950357551 —
    # a TIMEOUT, not fail-fast collateral, and it had gone unnoticed because
    # GitHub reports a job timeout as `cancelled`. One indivisible command
    # (`cargo llvm-cov --all-features --workspace`) instruments and runs the
    # whole workspace, so there is nothing here to split; 30 was simply under
    # the real cost. 60 matches what 8fd81062 gave the other acceptance gates.

    # All three feature sets, not just the all-features one. Before the split
    # these were steps of a single `test` job, so depending on `test` meant
    # depending on all of them; naming only `test` now would quietly narrow
    # that to one third of the suite.
    needs: [test, test-no-default-features, test-doc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
        with:
          shared-key: ci-native

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d  # v2.87.0
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ONE budget across five platforms whose durations differ by 4x does not work:
  # it is simultaneously too loose for linux (8m of work under a 30m wall) and
  # too tight for the slowest entry. macos-x64 crossed it and cancelled the whole
  # main run on 2026-09-09 (34329136447) while every other job in that run
  # SUCCEEDED — measured: linux-x64 8.3m, linux-arm64 8.2m, windows-x64 15.1m,
  # macos-arm64 19.9m, macos-x64 30.4m against the shared 30. The identical sha
  # had passed on its PR branch, so it read as flaky rather than as a wall
  # (aegis-g9gu2b).
  #
  # Budgets are therefore PER ENTRY. This is deliberately not the blanket raise
  # the Test Suite comment above argues against: that job was doing N growing
  # compiles and needed splitting, because one number for it would keep growing
  # and keep masking. A single-target release build cannot be split, and the
  # reason macos-x64 is slow is the runner — the Intel image is ~1.5x its Apple
  # Silicon sibling for the same work. Giving that ONE entry headroom keeps a
  # tight, meaningful wall on the other four rather than loosening all five to
  # the slowest.
  #
  # Keep these honest with scripts/audit-workflow-timeout-headroom.sh, which
  # reads each job against the budget in the commit that ran and flags anything
  # near its ceiling — a timeout surfaces as `cancelled`, which otherwise reads
  # as fail-fast collateral from a sibling.
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.build-timeout }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            build-timeout: 30
          # Linux ARM64 (native runner - 10x faster than QEMU)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            build-timeout: 30
          # macOS Apple Silicon (native)
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
            build-timeout: 40
          # macOS Intel — the slowest entry by far; 30.4m was a WALL, not a
          # duration, so its true cost is unknown and >= that. 60 buys real
          # headroom while still failing a genuine runaway.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
            build-timeout: 60
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            build-timeout: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary runs (Unix)
        if: runner.os != 'Windows'
        run: ./target/${{ matrix.target }}/release/br --version

      - name: Verify binary runs (Windows)
        if: runner.os == 'Windows'
        run: ./target/${{ matrix.target }}/release/br.exe --version

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: br-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/br

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: br-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/br.exe

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    # Calibration took 201 minutes for one build and three passes. Paired
    # comparisons build two revisions and measure both on this same runner.
    timeout-minutes: 360
    # Raised from 60 (aegis-44vjem).
    #
    # THE 27.6m "SUCCESS" OF 2026-09-02 WAS VACUOUS — do not use it as evidence
    # this job ever fit in 60 minutes. At that commit the step carried
    # `continue-on-error: true` and chose, on a criterion cache hit:
    #
    #     cargo bench --bench storage_perf -- --baseline main --save-baseline main
    #
    # which criterion REFUSES: "the argument '--baseline <baseline>' cannot be
    # used with '--save-baseline <save-baseline>'". It exited 2 after ~27m of
    # compile, `continue-on-error` reported the step SUCCESS, and the regression
    # check then compared the restored cache against itself and found nothing.
    # Every layer reported green and no benchmark ran.
    #
    # That invalid invocation is gone (the command is now the unconditional
    # `--save-baseline main`) and so is the continue-on-error. So benchmarks now
    # actually RUN — and 60m has never been validated as enough for that, because
    # until they ran nobody had a real duration to check it against.
    #
    # 120 was therefore a first honest single-pass budget.
    # There is NO measured evidence of a slowdown in the code under test: the
    # only completed-looking data point was the vacuous one above.
    #
    # The current 360m budget is for multiple passes, not a slower single pass.

    env:
      # A cold release build exceeded the hosted runner's memory and was
      # killed with SIGTERM before Criterion started. Bound compilation
      # concurrency so the regression gate actually reaches its benchmark.
      CARGO_BUILD_JOBS: 1
      # Criterion's default 100 samples made one batch case request 266s and
      # left delete/single collecting until the 60-minute job timeout. Ten is
      # Criterion's supported minimum and keeps the CI regression gate bounded.
      BENCH_SAMPLE_SIZE: 10
    # Reuse the Linux build job's populated Rust cache instead of starting a
    # second cold release build in the initial fan-out. Two cold benchmark
    # runners were preempted before Criterion started.
    needs: [check, build]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || inputs.calibrate_benchmarks || inputs.benchmark_base != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
        with:
          shared-key: ci-native

      - name: Prove benchmark gate controls
        run: python3 -m unittest discover -s scripts -p test_calibrate_benchmarks.py

      - name: Enforce same-runner benchmark regression gate
        if: ${{ !inputs.calibrate_benchmarks }}
        env:
          BENCH_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.benchmark_base }}
        run: python3 scripts/compare_benchmarks.py

      - name: Calibrate three passes on this runner
        if: inputs.calibrate_benchmarks
        run: python3 scripts/calibrate_benchmarks.py

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results
          path: |
            target/criterion/
            target/benchmark-calibration/
            target/benchmark-comparison/*/*.json
            target/benchmark-comparison/*/*.log
            target/benchmark-comparison/*/base/
            target/benchmark-comparison/*/candidate/
          if-no-files-found: ignore

  # Verify version auditing info is correctly embedded
  version-audit:
    name: Version Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: br-linux-x64
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/br

      - name: Verify version info
        run: |
          echo "=== Version output ==="
          ./bin/br --version
          echo ""
          echo "=== Checking for build info ==="
          VERSION_OUTPUT=$(./bin/br --version 2>&1 || true)
          if echo "$VERSION_OUTPUT" | grep -q "br\|beads"; then
            echo "Version info present"
          else
            echo "Warning: Version output may be missing expected info"
          fi

  e2e-quick:
    name: Quick E2E
    runs-on: ubuntu-latest
    # Cold precompilation of the six independent integration-test targets can
    # consume the former 30-minute budget before their fast test bodies run.
    timeout-minutes: 60
    env:
      # Keep hosted-runner resource use bounded and fail a hanging smoke test
      # quickly enough to report the test, rather than losing the runner.
      CARGO_BUILD_JOBS: 1
      E2E_TIMEOUT: 180
    # The first hosted run spent 7m48s on its cold build, leaving only two
    # minutes for six tests. Start after the build matrix so rust-cache can
    # restore compiled artifacts and retain a real test budget.
    needs: [check, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2.9.1
        with:
          shared-key: ci-native

      - name: Run quick E2E tests
        run: scripts/e2e.sh
        env:
          NO_COLOR: 1
          HARNESS_ARTIFACTS: 1

      - name: Upload E2E summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-quick-summary
          path: target/test-artifacts/e2e_quick_summary.json
          if-no-files-found: ignore
